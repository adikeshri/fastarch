repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending

  - repo: local
    hooks:
      # Run through `uv run` (rather than the ruff-pre-commit mirror) so the
      # hook always uses the exact ruff version pinned in uv.lock — a
      # separately-pinned mirror can drift out of sync with rule sets
      # (e.g. newer UP04x selectors) configured in pyproject.toml.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict type checking)
        entry: uv run mypy src
        language: system
        pass_filenames: false
        files: ^src/

      - id: import-linter
        name: import-linter (Clean Architecture dependency rules)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: ^src/

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^uv\.lock$
